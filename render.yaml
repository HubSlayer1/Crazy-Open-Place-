services:
  - type: web
    name: crazy-org-all-in-one
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: NODE_ENV=production node server.ts
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: FREEFIRE_API_KEY
        sync: false
      - key: FREEFIRE_API_BASE_URL
        value: https://api.gameskinbo.com
